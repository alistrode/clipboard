name: Clipboard Windows desktop acceptance
on:
  push:
    branches: [projects/clipboard]
    paths:
      - '.github/workflows/clipboard-windows.yml'
      - 'tests/windows-acceptance.py'
      - 'src/**'
      - 'scripts/**'
      - 'deliverables/windows.part*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/deliverables/
            /deliverables/windows.part*
            /deliverables/manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record actual OS and run database tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force acceptance | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture | ConvertTo-Json | Set-Content acceptance/os.json
          npm test
      - name: Run repository Windows package, registry, clipboard and screenshot checks
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows-acceptance.py
      - name: Show diagnostic logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem acceptance -File | Where-Object { $_.Name -match '^(app-|listener-)|^(failure|result|os)\.json$' } | ForEach-Object {
            Write-Host "--- $($_.Name) ---"
            Get-Content $_.FullName -ErrorAction Continue
          }
      - name: Save Windows evidence
        id: evidence
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-windows-${{ github.run_id }}
          path: acceptance/
          retention-days: 14
          if-no-files-found: error
      - name: Save evidence through fallback storage
        if: always() && steps.evidence.outcome == 'failure'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem acceptance -File | Where-Object { $_.Extension -in '.json','.png','.log' })
          if ($files.Count -eq 0) { throw 'No verification evidence to preserve' }
          Compress-Archive -Path $files.FullName -DestinationPath clipboard-evidence.zip -Force
          $bin = 'clipboard-ci-' + $env:GITHUB_RUN_ID
          curl.exe -fSs -X POST --data-binary '@clipboard-evidence.zip' -H 'Content-Type: application/octet-stream' -H 'Accept: application/json' ("https://filebin.net/$bin/evidence.zip") -o evidence-upload.json
          if ($LASTEXITCODE -ne 0) { throw 'Evidence fallback upload failed' }
          Get-FileHash clipboard-evidence.zip -Algorithm SHA256
          Write-Output ("Evidence URL: https://filebin.net/archive/$bin/zip")
